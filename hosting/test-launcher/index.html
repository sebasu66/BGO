<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGO Test Launcher</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171922;
      color: #eef0f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: linear-gradient(180deg, #171922 0%, #101116 100%);
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .panel {
      background: #232633;
      border: 1px solid #343847;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #aeb4c4; margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid #454a5c;
      background: #171922;
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
    }

    .clients {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .client {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .url {
      min-height: 72px;
      padding: 10px;
      border-radius: 8px;
      background: #111319;
      border: 1px solid #303442;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 750;
      padding: 9px 12px;
      background: #77a7ff;
      color: #0d1522;
    }

    button.secondary {
      background: #3a4050;
      color: #f4f6fb;
    }

    button:hover { filter: brightness(1.08); }

    .qr {
      align-self: center;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    .qr-placeholder {
      min-height: 150px;
      display: grid;
      place-items: center;
      color: #9da3b4;
      font-size: 13px;
      text-align: center;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      color: #aeb4c4;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      body { padding: 14px; }
      .clients { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>BGO Test Launcher</h1>
      <p class="subtitle">Abrí Display, Player 1 y Player 2 usando el mismo Game ID.</p>

      <label for="game-id">Game ID</label>
      <input id="game-id" type="text" value="TEST001" autocomplete="off" spellcheck="false">
    </section>

    <section class="clients">
      <article class="panel client">
        <h2>Display</h2>
        <div class="url" id="url-display"></div>
        <div class="buttons">
          <button type="button" data-open="display">Abrir</button>
          <button type="button" class="secondary" data-copy="display">Copiar URL</button>
        </div>
      </article>

      <article class="panel client">
        <h2>Player 1</h2>
        <div class="url" id="url-player1"></div>
        <div class="buttons">
          <button type="button" data-open="player1">Abrir</button>
          <button type="button" class="secondary" data-copy="player1">Copiar URL</button>
        </div>
        <canvas class="qr" id="qr-player1" width="150" height="150" aria-label="QR Player 1"></canvas>
      </article>

      <article class="panel client">
        <h2>Player 2</h2>
        <div class="url" id="url-player2"></div>
        <div class="buttons">
          <button type="button" data-open="player2">Abrir</button>
          <button type="button" class="secondary" data-copy="player2">Copiar URL</button>
        </div>
        <canvas class="qr" id="qr-player2" width="150" height="150" aria-label="QR Player 2"></canvas>
      </article>
    </section>

    <div class="status" id="status" aria-live="polite"></div>
  </main>

  <script>
    const gameInput = document.getElementById("game-id");
    const statusEl = document.getElementById("status");
    let qrPlayer1 = null;
    let qrPlayer2 = null;

    function buildUrls() {
      const game = encodeURIComponent(gameInput.value.trim() || "TEST001");
      const origin = window.location.origin;
      return {
        display: `${origin}/?role=display&game=${game}`,
        player1: `${origin}/?role=player&game=${game}&player=player_1`,
        player2: `${origin}/?role=player&game=${game}&player=player_2`
      };
    }

    function render() {
      const urls = buildUrls();
      document.getElementById("url-display").textContent = urls.display;
      document.getElementById("url-player1").textContent = urls.player1;
      document.getElementById("url-player2").textContent = urls.player2;

      if (qrPlayer1 && qrPlayer2) {
        qrPlayer1.value = urls.player1;
        qrPlayer2.value = urls.player2;
      }
    }

    async function copyUrl(type) {
      const url = buildUrls()[type];
      try {
        await navigator.clipboard.writeText(url);
        statusEl.textContent = "URL copiada.";
      } catch (error) {
        statusEl.textContent = "No se pudo usar el portapapeles; copiá la URL manualmente.";
      }
    }

    function openUrl(type) {
      window.open(buildUrls()[type], "_blank", "noopener");
    }

    function initQr() {
      if (typeof QRious !== "function") {
        statusEl.textContent = "No se pudo cargar el generador QR; los enlaces siguen funcionando.";
        document.getElementById("qr-player1").replaceWith(makeQrPlaceholder());
        document.getElementById("qr-player2").replaceWith(makeQrPlaceholder());
        return;
      }

      qrPlayer1 = new QRious({ element: document.getElementById("qr-player1"), size: 150 });
      qrPlayer2 = new QRious({ element: document.getElementById("qr-player2"), size: 150 });
    }

    function makeQrPlaceholder() {
      const div = document.createElement("div");
      div.className = "qr-placeholder";
      div.textContent = "QR no disponible";
      return div;
    }

    gameInput.addEventListener("input", render);
    document.querySelectorAll("[data-open]").forEach((button) => {
      button.addEventListener("click", () => openUrl(button.dataset.open));
    });
    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", () => copyUrl(button.dataset.copy));
    });

    initQr();
    render();
  </script>
</body>
</html>
