[runnable_presets]

Web="Web"

[preset.0]

name="Web"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="games/*/*.jsonh,src/capabilities/*.jsonh,src/components/*/component.jsonh,src/components/*/*/component.jsonh,src/components/*/*/*/component.jsonh"
exclude_filter="build/*,docs/*,examples/*,assets/source/*,assets/authoring/*,fastlane/*,backend/*,scripts/*,tests/*,hosting/*,src/authoring/*,src/editor/*,addons/asset_placer/*,addons/reactive_ui_editor/*,addons/reactive_ui_analyzer/*,addons/gdss/editor/*"
export_path="build/web/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
(() => {
  if (window.__bgoFlightRecorder) return;

  const max = 250;
  const cut = 2000;
  const entries = [];
  let gen = 0;

  const safe = (v) => {
    try {
      if (v instanceof Error)
        return `${v.name}: ${v.message} ${v.stack || \"\"}`;
      if (typeof v === \"string\")
        return v;
      return JSON.stringify(v);
    } catch {
      return String(v);
    }
  };

  const add = (level, args) => {
    const text = Array.from(args)
      .map(safe)
      .join(\" \")
      .slice(0, cut);

    entries.push({
      ts: Date.now(),
      level,
      text
    });

    if (entries.length > max)
      entries.splice(0, entries.length - max);
  };

  const mark = (reason) => {
    gen++;
    add(\"error\", [reason]);
  };

  [\"debug\", \"log\", \"info\", \"warn\", \"error\"].forEach((level) => {
    const original = console[level].bind(console);

    console[level] = (...args) => {
      add(level, args);

      if (level === \"error\")
        gen++;

      original(...args);
    };
  });

  window.addEventListener(\"error\", (e) => {
    mark(
      `window.onerror: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`
    );

    if (e.error && e.error.stack)
      add(\"error\", [e.error.stack]);
  });

  window.addEventListener(\"unhandledrejection\", (e) => {
    mark(`unhandledrejection: ${safe(e.reason)}`);
  });

  window.__bgoFlightRecorder = {
    markError: mark,

    snapshot: () => ({
      error_generation: gen,
      error_seen: gen > 0,
      url: location.href,
      user_agent: navigator.userAgent,
      entries: entries.slice()
    })
  };

  add(\"debug\", [\"BGO flight recorder ready\"]);
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
