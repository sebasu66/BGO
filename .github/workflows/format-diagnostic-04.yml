name: BGO Format Diagnostic 04

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  gdformat-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Apply exact gdformat output
        run: |
          gdformat src/core/gameplay_state.gd src/demo/runtime_session_adapter.gd src/demo/main_logical_runtime.gd tests/gameplay_state_test.gd tests/runtime_session_adapter_test.gd

      - name: Commit formatting when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/gameplay_state.gd src/demo/runtime_session_adapter.gd src/demo/main_logical_runtime.gd tests/gameplay_state_test.gd tests/runtime_session_adapter_test.gd
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: apply gdformat to runtime adapter batch"
          git push origin HEAD:${{ github.head_ref }}
