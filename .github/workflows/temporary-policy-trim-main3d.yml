name: Temporary Policy Trim Main3D

on:
  push:
    branches:
      - feature/dev-workbench
    paths:
      - scripts/temporary_policy_trim_main3d.py
      - .github/workflows/temporary-policy-trim-main3d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dev-workbench
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'gdtoolkit==4.*'
      - run: python3 scripts/temporary_policy_trim_main3d.py
      - run: gdformat src tests
      - run: |
          rm scripts/temporary_policy_trim_main3d.py
          rm .github/workflows/temporary-policy-trim-main3d.yml
      - name: Commit trim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts .github/workflows
          git commit -m 'refactor: keep main3d demo modules within policy limits'
          git push origin HEAD:feature/dev-workbench
