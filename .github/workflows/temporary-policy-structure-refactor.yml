name: Temporary Policy Structure Refactor

on:
  push:
    branches:
      - feature/dev-workbench
    paths:
      - scripts/temporary_policy_structure_refactor.py
      - .github/workflows/temporary-policy-structure-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v6
        with:
          ref: feature/dev-workbench
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install GDScript formatter
        run: pip install 'gdtoolkit==4.*'

      - name: Apply structural refactor
        run: python3 scripts/temporary_policy_structure_refactor.py

      - name: Format GDScript
        run: gdformat src tests

      - name: Remove temporary refactor tooling
        run: |
          rm scripts/temporary_policy_structure_refactor.py
          rm .github/workflows/temporary-policy-structure-refactor.yml

      - name: Commit structural cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts .github/workflows
          git commit -m 'refactor: align demo structure with protected policy'
          git push origin HEAD:feature/dev-workbench
