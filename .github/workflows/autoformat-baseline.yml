name: Autoformat GDScript baseline

on:
  push:
    branches:
      - feature/dev-workbench

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dev-workbench
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gdtoolkit
        run: pip install 'gdtoolkit==4.*'
      - name: Format GDScript
        run: gdformat src tests
      - name: Commit formatting baseline
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'style: apply gdformat baseline'
          git push origin HEAD:feature/dev-workbench
