name: BGO Quality Gate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: bgo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context-integrity:
    name: Project context integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: sebasu66/AI_commit_integrity_check/.github/workflows/integrity.yml@3f3fab1bc1cc38745a8ec8763a0a8463de2ba0f1
    with:
      skill_path: SKILL.md
    permissions:
      contents: read

  project-policy:
    name: Protected code policy
    uses: sebasu66/AI_commit_integrity_check/.github/workflows/project-policy.yml@3f3fab1bc1cc38745a8ec8763a0a8463de2ba0f1
    with:
      policy: BGO
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
    permissions:
      contents: read

  quality-gate:
    needs:
      - context-integrity
      - project-policy
    if: >-
      always() &&
      (needs.context-integrity.result == 'success' || needs.context-integrity.result == 'skipped') &&
      needs.project-policy.result == 'success'
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GDScript tooling
        run: pip install "gdtoolkit==4.*"

      - name: Install browser test package
        timeout-minutes: 5
        run: npm install

      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Install Chromium headless shell
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install chromium --only-shell

      - name: Project structure and architecture
        id: structure
        run: python scripts/check_structure.py

      - name: GDScript format
        id: format
        run: gdformat --check src tests

      - name: GDScript lint
        id: lint
        run: gdlint src tests

      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$target"
          cp -R /tmp/godot-templates/templates/. "$target/"

      - name: Godot version
        run: godot --version

      - name: Godot import and parse
        id: import
        run: godot --headless --path . --import --quit

      - name: Headless core tests
        id: tests
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Validated Web export
        id: web_export
        shell: bash
        run: bash scripts/export_web.sh

      - name: Write build and deploy metadata
        run: node scripts/write_build_info.mjs

      - name: Browser E2E against exported build
        id: e2e_local
        run: npm run test:e2e

      - name: Deploy validated build to Firebase DEV channel
        id: deploy_dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOARD_GAME_ONLINE_68C3F }}
          projectId: board-game-online-68c3f
          channelId: dev
          expires: 30d

      - name: Show deployed DEV URL
        if: steps.deploy_dev.outcome == 'success'
        run: echo "DEV URL ${{ steps.deploy_dev.outputs.details_url }}"

      - name: Browser E2E against deployed DEV
        id: e2e_dev
        if: steps.deploy_dev.outcome == 'success'
        env:
          BGO_E2E_BASE_URL: ${{ steps.deploy_dev.outputs.details_url }}
        run: npm run test:e2e

      - name: Write CI dashboard result
        if: always()
        shell: bash
        run: |
          mkdir -p build/web/project-status
          cat > build/web/project-status/ci.json <<EOF
          {
            "status": "${{ job.status }}",
            "label": "${{ job.status }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "format": "${{ steps.format.outcome }}",
            "lint": "${{ steps.lint.outcome }}",
            "structure": "${{ steps.structure.outcome }}",
            "godot_import": "${{ steps.import.outcome }}",
            "core_tests": "${{ steps.tests.outcome }}",
            "web_export": "${{ steps.web_export.outcome }}",
            "e2e_local": "${{ steps.e2e_local.outcome }}",
            "deploy_dev": "${{ steps.deploy_dev.outcome }}",
            "e2e_dev": "${{ steps.e2e_dev.outcome }}",
            "dev_url": "${{ steps.deploy_dev.outputs.details_url }}"
          }
          EOF

      - name: Publish final CI metadata to Firebase DEV
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.e2e_dev.outcome == 'success'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOARD_GAME_ONLINE_68C3F }}
          projectId: board-game-online-68c3f
          channelId: dev
          expires: 30d

      - name: Upload validated Web build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgo-web-${{ github.run_id }}
          path: build/web
          if-no-files-found: warn
          retention-days: 7

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgo-e2e-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  request-copilot-audit:
    name: Request advisory Copilot whole-project audit
    needs:
      - quality-gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create audit request and assign Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INTEGRATED_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          title="Project audit after DEV integration ${INTEGRATED_SHA:0:8}"
          body=$(cat <<EOF
          Perform an independent, whole-project advisory audit of BGO at the current develop commit ${INTEGRATED_SHA}.

          Do not limit the analysis to the latest diff. Inspect the full develop codebase and repository context broadly: SKILL.md, authoritative docs, AI_BACKLOG.md, workflows, src, tests, games, and web/project-status.

          Evaluate product/architecture alignment, modularity and cohesion, duplicated or competing abstractions, domain-state authority versus UI/rendering/Firebase, GamePackage boundaries, session/tabletop design, privacy/security, test evidence, CI/CD health, stale documentation/status, technical debt, performance or asset-pipeline risks supported by evidence, and opportunities for simplification or optimization.

          Separate evidence, inference and suggestion. Cite concrete repository paths for material findings. Use severities critical/high/medium/low/observation. A green CI run is evidence of mechanical health, not proof of architectural health.

          Produce the written report only in docs/audits/copilot-project-audit.md. Replace the prior report. Include the audited commit and this Quality Gate run. Do not change source code, backlog state, project-status values, workflows, release branches, or product decisions. The report is advisory and must not block or authorize anything automatically.

          Audited commit: ${INTEGRATED_SHA}
          Quality Gate: ${SOURCE_RUN}
          EOF
          )

          issue_json=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues" \
            -f title="$title" \
            -f body="$body")

          issue_number=$(printf '%s' "$issue_json" | jq -r '.number')
          echo "Created advisory audit request issue #${issue_number}."

          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/issues/${issue_number}/assignees" \
            --input - <<EOF
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${REPOSITORY}",
              "base_branch": "develop",
              "custom_instructions": "Perform the whole-project advisory audit exactly as described in the issue. Modify only docs/audits/copilot-project-audit.md."
            }
          }
          EOF
          then
            echo "Copilot cloud agent assigned to issue #${issue_number}."
          else
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "Automatic Copilot assignment was unavailable. The audit request remains open and is advisory; DEV integration stays green. Assign this issue to Copilot manually if needed."
            echo "::warning::Could not auto-assign Copilot. Audit issue #${issue_number} remains available for manual assignment."
          fi
